name: Security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high

  codeql:
    # Private repositories need an eligible licence and repository enablement.
    if: ${{ !github.event.repository.private || vars.CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.CODE_SECURITY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  private-repository-notice:
    if: ${{ github.event.repository.private && vars.CODE_SECURITY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain unavailable checks
        run: echo "::notice::CodeQL and dependency review are not enabled for this private repository. Enable CODE_SECURITY_ENABLED only after verifying GitHub Code Security eligibility. The dependency audit still runs."
