name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  SITE_URL: https://osiris-balonga.github.io/drawmotion/
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit, component and integration tests with shared coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ github.sha }}
          path: .artifacts/coverage/
          include-hidden-files: true
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify MediaPipe assets
        run: pnpm verify:vision-assets

      - name: Build production assets
        run: pnpm build

      - name: Check application and Worker bundle budgets
        run: pnpm verify:bundle

      - name: Upload production build
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Package GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  e2e-chromium:
    name: e2e-chromium
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download verified production build
        uses: actions/download-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Run browser journeys
        run: pnpm test:e2e:ui
        env:
          E2E_USE_BUILD: "1"

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            .artifacts/playwright-report/
            .artifacts/test-results/
          include-hidden-files: true
          retention-days: 7

  pwa:
    name: pwa
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Download verified production build A
        uses: actions/download-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Verify cold offline launch and deferred A/B updates
        run: pnpm test:pwa
        env:
          E2E_USE_BUILD: "1"
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pwa-failures-${{ github.sha }}
          path: |
            .artifacts/playwright-report/
            .artifacts/test-results/
          include-hidden-files: true
          retention-days: 7

  deploy-pages:
    name: deploy-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, unit-tests, build, e2e-chromium, pwa]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v5
