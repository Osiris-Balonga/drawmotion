allowBuilds:
  # Optional image-generator peer required by Vite PWA's public types only.
  # Icons are packaged with the existing Playwright browser, not native scripts.
  sharp: false
overrides:
  # Resolve the high-severity prototype-pollution denial-of-service advisory.
  js-yaml: 4.3.2
  # Pin the patched type-only upstream fix until unconfig publishes valid types.
  "@vite-pwa/assets-generator>unconfig": 7.3.3
  # Optional build-time image tooling must not retain vulnerable libvips builds.
  "@vite-pwa/assets-generator>sharp": 0.35.5
  "sharp-ico>sharp": 0.35.5
  # Keep security fixes within the transitive package's supported major version.
  "brace-expansion@1": 1.1.21
  "brace-expansion@2": 2.1.7
  "fast-uri@3": 3.1.9
  "source-map-js@1": 1.2.2
  "undici@8": 8.12.2
  "serialize-javascript@7": 7.1.3
  # React Hooks supports both Zod majors; select its patched supported major.
  "eslint-plugin-react-hooks>zod": 4.6.6
  "eslint-plugin-react-hooks>zod-validation-error": 4.0.2
  # This consumer uses the matching function, not removed RegExp/AST APIs.
  "@typescript-eslint/typescript-estree@8>minimatch": 11.0.8
  # Workbox uses globSync(pattern, { cwd, follow, ignore }), retained in glob 14.
  "workbox-build@7>glob": 14.0.2
  "glob@14>minimatch": 11.0.8
patchedDependencies:
  unconfig@7.3.3: patches/unconfig@7.3.3.patch
  # Declaration-only compatibility with sharp's named type exports in 0.35.
  "@vite-pwa/assets-generator@1.0.2": patches/@vite-pwa__assets-generator@1.0.2.patch
