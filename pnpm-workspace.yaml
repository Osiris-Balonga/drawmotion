allowBuilds:
  # Optional image-generator peer required by Vite PWA's public types only.
  # Icons are packaged with the existing Playwright browser, not native scripts.
  sharp: false
overrides:
  # Pin the patched type-only upstream fix until unconfig publishes valid types.
  "@vite-pwa/assets-generator>unconfig": 7.3.3
  # Optional build-time image tooling must not retain vulnerable libvips builds.
  "@vite-pwa/assets-generator>sharp": 0.35.4
  "sharp-ico>sharp": 0.35.4
patchedDependencies:
  unconfig@7.3.3: patches/unconfig@7.3.3.patch
  # Declaration-only compatibility with sharp's named type exports in 0.35.
  "@vite-pwa/assets-generator@1.0.2": patches/@vite-pwa__assets-generator@1.0.2.patch
